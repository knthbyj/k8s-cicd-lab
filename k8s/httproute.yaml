apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fastapi-route
  namespace: default
spec:
  parentRefs:
    - name: eg
      sectionName: http
  hostnames:
    - fastapi.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fastapi-demo
          port: 80
